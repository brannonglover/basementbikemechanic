[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Public Turnstile site key (same widget as BikeOps). CRA only inlines REACT_APP_*.
  REACT_APP_TURNSTILE_SITE_KEY = "0x4AAAAAAEILjjXCF6DLhly_"
  # Site keys must ship in client JS — omit from Netlify secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_TURNSTILE_SITE_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY"
